<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Таймер до дембеля</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#eceef2;--b1:#c4c9d4;--b2:#ffffff;--b3:#a9afbd;--g1:rgba(255,255,255,.62);--g2:rgba(255,255,255,.2);--edge:rgba(255,255,255,.95);--ring:rgba(0,0,0,.07);--text:#0a0a0a;--sub:rgba(10,10,10,.7);--track:rgba(0,0,0,.12);--bar1:#6b6f78;--bar2:#0a0a0a;--glow:rgba(0,0,0,.22);--pill:rgba(255,255,255,.9);--shadow:rgba(20,24,36,.2);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--b1:#3b3f4a;--b2:#1d2027;--b3:#5b606d;--g1:rgba(255,255,255,.17);--g2:rgba(255,255,255,.04);--edge:rgba(255,255,255,.32);--ring:rgba(255,255,255,.09);--text:#fff;--sub:rgba(255,255,255,.76);--track:rgba(255,255,255,.2);--bar1:#8b909c;--bar2:#fff;--glow:rgba(255,255,255,.45);--pill:rgba(255,255,255,.26);--shadow:rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--b1:#3b3f4a;--b2:#1d2027;--b3:#5b606d;--g1:rgba(255,255,255,.17);--g2:rgba(255,255,255,.04);--edge:rgba(255,255,255,.32);--ring:rgba(255,255,255,.09);--text:#fff;--sub:rgba(255,255,255,.76);--track:rgba(255,255,255,.2);--bar1:#8b909c;--bar2:#fff;--glow:rgba(255,255,255,.45);--pill:rgba(255,255,255,.26);--shadow:rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;overflow:hidden;font-size:clamp(9px,min(2.15vh,4.3vw),17px);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:400 1rem/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.blob{position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
.blob.a{width:60vmax;height:60vmax;background:var(--b1);top:-22vmax;left:-20vmax}
.blob.b{width:50vmax;height:50vmax;background:var(--b3);bottom:-16vmax;right:-18vmax;animation-delay:-8s;opacity:.8}
.blob.c{width:34vmax;height:34vmax;background:var(--b2);top:38%;left:35%;opacity:.8;animation-delay:-13s}
.orb{position:fixed;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.8),rgba(255,255,255,.14) 55%,rgba(255,255,255,.05));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 2px 2px rgba(255,255,255,.9),inset 0 -8px 20px rgba(255,255,255,.2),0 18px 36px var(--shadow);animation:bob 9s ease-in-out infinite alternate}
.orb.o1{width:7rem;height:7rem;top:5%;right:-1.5rem}
.orb.o2{width:5rem;height:5rem;top:46%;left:-1.4rem;animation-delay:-3s}
.orb.o3{width:8rem;height:8rem;bottom:14%;right:-2.5rem;animation-delay:-6s}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.15)}}
@keyframes bob{to{transform:translateY(-1.2rem)}}
@keyframes fade{from{opacity:0;transform:translateY(.6rem)}}
@media (prefers-reduced-motion:reduce){.blob,.orb,.view.on{animation:none}}
main{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;padding:.8rem 1rem .8rem;display:flex;flex-direction:column;gap:.6rem}
header{display:flex;justify-content:space-between;align-items:baseline;padding:0 .3rem}
h1{margin:0;font-size:1.65rem;line-height:1.1;letter-spacing:-.02em;font-weight:800}
.lead{font-size:.78rem;font-weight:600;color:var(--sub)}
.glass{position:relative;overflow:hidden;border-radius:1.6rem;background:linear-gradient(145deg,var(--g1),var(--g2));-webkit-backdrop-filter:blur(36px) saturate(180%) brightness(1.06);backdrop-filter:blur(36px) saturate(180%) brightness(1.06);box-shadow:0 0 0 .5px var(--ring),inset 0 1.5px 1px var(--edge),inset 0 -1px 1px var(--edge),inset 1px 0 1px rgba(255,255,255,.3),inset -1px 0 1px rgba(255,255,255,.18),inset 0 0 1.2rem rgba(255,255,255,.14),0 .9rem 2.2rem var(--shadow)}
.glass::before{content:"";position:absolute;left:-10%;top:-60%;width:120%;height:100%;border-radius:50%;background:radial-gradient(ellipse at 40% 70%,rgba(255,255,255,.5),rgba(255,255,255,0) 65%);opacity:.5;pointer-events:none}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.26) 50%,rgba(255,255,255,0) 60%);pointer-events:none}
.glass>*{position:relative;z-index:1}
.views{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column;gap:.6rem}
.view.on{display:flex;animation:fade .35s ease}
.hero{flex:1;min-height:0;padding:.9rem .8rem;display:flex;flex-direction:column;justify-content:center;gap:.6rem}
.hero h2{margin:0;font-size:.8rem;font-weight:650;color:var(--sub);text-align:center}
.units{display:grid;gap:.45rem}
.r1{grid-template-columns:1fr 1fr}.r2{grid-template-columns:repeat(3,1fr)}
.u,.tile{border-radius:1.2rem;padding:.6rem 0 .5rem;text-align:center;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 0 0 .5px var(--ring),inset 0 1px 1px var(--edge),inset 0 -1px 1px rgba(255,255,255,.2),0 .3rem .7rem rgba(0,0,0,.08)}
.u b{display:block;font-size:1.9rem;line-height:1.05;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.r1 .u{padding:1rem 0 .8rem}.r1 .u b{font-size:3.7rem;font-weight:800}
.u span,.tile span{display:block;margin-top:.1rem;font-size:.68rem;font-weight:600;color:var(--sub)}
.bar{height:.4rem;border-radius:.4rem;background:var(--track);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
.bar i{display:block;height:100%;width:0;border-radius:.4rem;background:linear-gradient(90deg,var(--bar1),var(--bar2));box-shadow:0 0 .7rem var(--glow);transition:width .6s}
.hero .bar{height:.55rem;margin-top:.3rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.tile{border-radius:1.4rem;padding:.7rem 0 .6rem}
.tile.glass{padding:.7rem 0 .6rem}
.tile b{display:block;font-size:1.4rem;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:.35rem;min-height:0}
h3{margin:0 .3rem;font-size:.95rem;font-weight:700}
.grid{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;gap:.5rem}
.g2{grid-template-columns:1fr 1fr}
.card{padding:.5rem .8rem;display:grid;align-content:center;align-items:center;gap:.35rem .6rem;grid-template-columns:auto 1fr auto;min-height:0}
.card .bar{grid-column:1/-1}
.ic{width:2.1rem;height:2.1rem;border-radius:.7rem;display:grid;place-items:center;font-size:1.1rem;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 0 0 .5px var(--ring),inset 0 1px 1px var(--edge)}
.nm b{display:block;font-size:1rem;font-weight:650;line-height:1.1}
.nm small,.s{font-size:.7rem;font-weight:600;color:var(--sub);white-space:nowrap}
.nm .pc{font-weight:800;color:var(--text)}
.vl{text-align:right;line-height:1.15}.vl small{display:block;font-size:.7rem;font-weight:600;color:var(--sub)}
.v{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.sn .v{grid-column:1/-1;font-size:.95rem}
.sn .s{text-align:right}
.nav{position:relative;width:min(100%,19rem);margin:0 auto;padding:.3rem;border-radius:2.4rem;display:grid;grid-template-columns:1fr 1fr;flex:none}
.nav .pill{position:absolute;z-index:0;top:.3rem;bottom:.3rem;left:.3rem;width:calc(50% - .3rem);border-radius:2.1rem;background:var(--pill);box-shadow:0 0 0 .5px var(--ring),inset 0 1px 1px var(--edge),0 .3rem .8rem rgba(0,0,0,.14);transition:transform .4s cubic-bezier(.3,1.35,.5,1)}
.nav[data-tab="more"] .pill{transform:translateX(100%)}
.nav button{appearance:none;border:0;background:none;font:inherit;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:.12rem;padding:.5rem 0 .42rem;font-size:.7rem;font-weight:650;cursor:pointer;z-index:1;transition:color .25s}
.nav button[aria-selected="true"]{color:var(--text)}
.nav svg{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card.done .v{color:var(--text)}
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main>
<header><h1>До дембеля</h1><span class="lead">28.04.2026 — 27.10.2027</span></header>

<div class="views">
<section class="view on" id="v-main">
<div class="glass hero">
<h2 id="hs">Осталось до конца службы</h2>
<div class="units r1">
<div class="u"><b id="m">0</b><span id="lm">месяцев</span></div>
<div class="u"><b id="d">0</b><span id="ld">дней</span></div>
</div>
<div class="units r2">
<div class="u"><b id="h">0</b><span id="lh">часов</span></div>
<div class="u"><b id="mi">0</b><span id="lmi">минут</span></div>
<div class="u"><b id="s">0</b><span id="ls">секунд</span></div>
</div>
<div class="bar"><i id="bp"></i></div>
</div>
<div class="tiles">
<div class="tile glass"><b id="pd">0</b><span id="lpd">дней прошло</span></div>
<div class="tile glass"><b id="pp">0%</b><span>выполнено</span></div>
<div class="tile glass"><b id="rd">0</b><span id="lrd">дней осталось</span></div>
</div>
</section>

<section class="view" id="v-more">
<div class="sec" style="flex:3"><h3>Периоды</h3><div class="grid" id="periods"></div></div>
<div class="sec" style="flex:2"><h3>Времена года</h3><div class="grid g2" id="seasons"></div></div>
</section>
</div>

<nav class="glass nav" id="nav" data-tab="main">
<span class="pill"></span>
<button data-v="main" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 1.6M9.5 2.8h5"/></svg>Основной</button>
<button data-v="more" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Второстепенные</button>
</nav>
</main>
<script>
(function(){
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();}catch(e){}
 if(tg.colorScheme){document.documentElement.setAttribute('data-theme',tg.colorScheme);}}

var START=new Date(2026,3,28,0,0,0);
var END=new Date(2027,9,27,23,59,59);
var P=[
 {n:'1 период',i:'🥇',a:START,b:new Date(2026,9,28)},
 {n:'2 период',i:'🥈',a:new Date(2026,9,28),b:new Date(2027,3,28)},
 {n:'3 период',i:'🥉',a:new Date(2027,3,28),b:END}
];
var S=[
 {n:'Зима',i:'❄️',a:new Date(2026,11,1),b:new Date(2027,2,1)},
 {n:'Весна',i:'🌱',a:new Date(2027,2,1),b:new Date(2027,5,1)},
 {n:'Лето',i:'☀️',a:new Date(2027,5,1),b:new Date(2027,8,1)},
 {n:'Осень',i:'🍂',a:new Date(2027,8,1),b:END}
];
function $(id){return document.getElementById(id)}
function pad(n){return n<10?'0'+n:''+n}
function pl(n,f){var a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return f[2];if(b>1&&b<5)return f[1];if(b===1)return f[0];return f[2]}
function addM(d,n){var x=new Date(d.getFullYear(),d.getMonth()+n,1,d.getHours(),d.getMinutes(),d.getSeconds());
 var dim=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d.getDate(),dim));return x}
function diff(a,b){
 if(b<=a)return{m:0,d:0,h:0,mi:0,s:0};
 var m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
 while(m>0&&addM(a,m)>b)m--;
 var r=Math.floor((b-addM(a,m))/1000);
 return{m:m,d:Math.floor(r/86400),h:Math.floor(r%86400/3600),mi:Math.floor(r%3600/60),s:r%60}
}
function fmt(x){return (x.m?x.m+' мес ':'')+x.d+' дн '+pad(x.h)+':'+pad(x.mi)+':'+pad(x.s)}
function sd(d){return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)}
var D=['день','дня','дней'];

function build(list,box,season){
 list.forEach(function(it){
  var el=document.createElement('div');
  el.className='glass card '+(season?'sn':'p');
  el.innerHTML=season
   ?'<div class="ic">'+it.i+'</div><div class="nm"><b>'+it.n+'</b><small class="pc"></small></div><small class="s"></small><div class="v"></div><div class="bar"><i></i></div>'
   :'<div class="ic">'+it.i+'</div><div class="nm"><b>'+it.n+'</b><small>'+sd(it.a)+' — '+sd(it.b)+'</small></div><div class="vl"><small class="s"></small><span class="v"></span></div><div class="bar"><i></i></div>';
  $(box).appendChild(el);it.el=el;
 });
}
function upd(it,now){
 var el=it.el,s=el.querySelector('.s'),v=el.querySelector('.v'),bar=el.querySelector('.bar i');
 el.classList.remove('done');
 var p=now<it.a?0:now>=it.b?100:(now-it.a)/(it.b-it.a)*100,pt=p.toFixed(p===0||p>=100?0:1)+'%',pc=el.querySelector('.pc'),st;
 if(now<it.a){st='до начала';v.textContent=fmt(diff(now,it.a));}
 else if(now>=it.b){st='завершено';v.textContent='Пройдено ✓';el.classList.add('done');}
 else{st='до конца';v.textContent=fmt(diff(now,it.b));}
 bar.style.width=p.toFixed(2)+'%';
 if(pc){pc.textContent=pt;s.textContent=st;}else{s.textContent=st+' · '+pt;}
}
build(P,'periods',false);build(S,'seasons',true);

function tick(){
 var now=new Date();
 if(now>=END){$('hs').textContent='Дембель наступил 🎉';['m','d','h','mi','s'].forEach(function(i){$(i).textContent='0'});}
 else{
  var x=diff(now,END);
  $('m').textContent=x.m;$('d').textContent=x.d;$('h').textContent=pad(x.h);$('mi').textContent=pad(x.mi);$('s').textContent=pad(x.s);
  $('lm').textContent=pl(x.m,['месяц','месяца','месяцев']);
  $('ld').textContent=pl(x.d,D);
  $('lh').textContent=pl(x.h,['час','часа','часов']);
  $('lmi').textContent=pl(x.mi,['минута','минуты','минут']);
  $('ls').textContent=pl(x.s,['секунда','секунды','секунд']);
 }
 var pr=Math.min(1,Math.max(0,(now-START)/(END-START)));
 $('bp').style.width=(pr*100).toFixed(2)+'%';
 $('pp').textContent=(pr*100).toFixed(1)+'%';
 var pd=Math.max(0,Math.floor((now-START)/864e5));
 $('pd').textContent=pd;$('lpd').textContent=pl(pd,D)+' прошло';
 var rd=Math.max(0,Math.ceil((END-now)/864e5));
 $('rd').textContent=rd;$('lrd').textContent=pl(rd,D)+' осталось';
 P.concat(S).forEach(function(it){upd(it,now)});
}
tick();setInterval(tick,1000);

var nav=$('nav'),btns=nav.querySelectorAll('button');
function show(v){
 document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('on',x.id==='v-'+v)});
 nav.setAttribute('data-tab',v);
 btns.forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-v')===v)});
 try{history.replaceState(null,'','#'+v)}catch(e){}
}
btns.forEach(function(b){b.addEventListener('click',function(){show(b.getAttribute('data-v'))})});
show(location.hash==='#more'?'more':'main');
})();
</script>
</body>
</html>
